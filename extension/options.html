<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LeetGate Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(56, 189, 248, 0.25), transparent 60%),
          radial-gradient(circle at bottom, rgba(99, 102, 241, 0.2), transparent 60%),
          #0f172a;
      }
      main {
        width: min(640px, 92vw);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 16px;
        padding: 32px 32px 28px;
        box-shadow: 0 28px 60px rgba(15, 23, 42, 0.45);
      }
      h1 {
        margin: 0 0 18px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p.lead {
        margin: 0 0 24px;
        font-size: 15px;
        color: rgba(226, 232, 240, 0.75);
      }
      label {
        display: block;
        margin-bottom: 18px;
      }
      label span {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 14px;
        color: rgba(226, 232, 240, 0.9);
      }
      input[type="number"],
      textarea {
        width: 100%;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: rgba(15, 23, 42, 0.65);
        color: inherit;
        padding: 10px 12px;
        font-size: 14px;
        resize: vertical;
        min-height: 44px;
      }
      textarea {
        min-height: 120px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
        align-items: center;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        color: #0f172a;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        box-shadow: 0 12px 24px rgba(56, 189, 248, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button.secondary {
        background: transparent;
        color: #f8fafc;
        border: 1px solid rgba(148, 163, 184, 0.6);
        box-shadow: none;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 35px rgba(56, 189, 248, 0.45);
      }
      .status {
        font-size: 13px;
        color: rgba(166, 173, 186, 0.9);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LeetGate Settings</h1>
      <p class="lead">Customize your daily target, override window, and which sites LeetGate should gate.</p>
      <form id="settings-form">
        <label>
          <span>Daily solve target</span>
          <input type="number" id="daily-goal" min="1" required />
        </label>
        <label>
          <span>Override duration (minutes)</span>
          <input type="number" id="override-minutes" min="1" required />
        </label>
        <label>
          <span>Gated domains (one per line)</span>
          <textarea id="gated-domains" placeholder="youtube.com&#10;instagram.com&#10;x.com"></textarea>
        </label>
        <div class="actions">
          <button type="submit">Save settings</button>
          <button type="button" class="secondary" id="reset-progress">Reset today</button>
          <span id="status" class="status"></span>
        </div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
